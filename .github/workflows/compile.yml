name: Prepare Among Us IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download iOSGods IPA via Pixeldrain API
        run: |
          curl -L -o AmongUs-iOSGods.ipa "https://pixeldrain.com/api/file/8vUmrMYq"

      - name: Upload Final IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmongUs-iOSGods-Ready
          path: AmongUs-iOSGods.ipa
          retention-days: 7
